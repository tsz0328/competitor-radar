# Alembic configuration (milestone 11).
#
# NOTE: this file is intentionally ASCII-only. Alembic reads it with
# encoding="locale", which is GBK on a Chinese Windows host and would fail on
# any non-ASCII byte. Keep comments in English here; Chinese notes live in
# migrations/README and migrations/env.py (those are read as UTF-8).
#
# sqlalchemy.url is deliberately NOT set here: migrations/env.py takes the URL
# from the application settings (backend/.env -> DB_URL), so migrations and the
# app can never point at different databases.
[alembic]
# Directory holding the migration scripts.
script_location = migrations
# Make `import app` work when running alembic from backend/.
prepend_sys_path = .
# Timestamped revision filenames for easy chronological sorting.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# Use os.sep when splitting version paths (Windows-friendly).
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
