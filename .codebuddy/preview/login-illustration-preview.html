<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录页左侧插画 · 升级预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: stretch;
    background: #0a2348;
  }

  /* 左侧品牌面板：深蓝渐变，白字，模拟登录页左侧环境 */
  .panel {
    position: relative;
    flex: 1;
    min-width: 420px;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 2vh;
    padding: 5vh 4vw;
    color: #fff;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 18% 12%, #1f5fb0 0%, #13407f 42%, #0c2a5c 100%);
  }

  .header { position: relative; z-index: 2; line-height: 1.4; }
  .title {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .title .hl {
    background: linear-gradient(90deg, #b9a9f5, #7fb0f5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    margin-top: 10px;
    font-size: 15px;
    color: rgba(255,255,255,0.7);
  }

  /* 舞台：雷达 + 浮动卡片 */
  .stage {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 320px;
  }
  .radar { width: min(100%, 460px); height: auto; display: block; }

  /* 浮动竞品卡片（毛玻璃） */
  .chip {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.22);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    animation: floatY 5s ease-in-out infinite;
  }
  .chip .dot {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 700; flex: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .chip .info { display: flex; flex-direction: column; min-width: 0; }
  .chip .info b { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.92); }
  .chip .info span { font-size: 12px; color: rgba(255,255,255,0.66); white-space: nowrap; }
  .chip.tl { left: 0; top: 8%; animation-delay: 0s; }
  .chip.tr { right: 0; top: 24%; animation-delay: 1.2s; }
  .chip.bl { left: 4%; bottom: 14%; animation-delay: 2.4s; }
  .chip.br { right: 2%; bottom: 4%; animation-delay: 3.6s; }

  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* 底部能力标签 */
  .features {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .feature {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    flex: 1;
  }
  .feature .ic {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #b9a9f5;
    background: rgba(255,255,255,0.16);
  }
  .feature .ic svg { width: 20px; height: 20px; }
  .feature b { font-size: 13px; font-weight: 600; }
  .feature span { font-size: 11px; color: rgba(255,255,255,0.6); }
  /* 被扫亮的光点加发光晕（仅作用于 SVG 圆点，不波及 HTML 卡片小方块） */
  circle.dot { filter: url(#blipGlow); }
</style>
</head>
<body>
  <aside class="panel">
    <div class="header">
      <div class="title">捕捉变化，<span class="hl">洞察先机</span></div>
      <div class="subtitle">实时监控市场动态 · 智能分析竞品变化 · 助力决策领先一步</div>
    </div>

    <div class="stage">
      <svg class="radar" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 网格线：以雷达圆心(300,300)为圆心的径向渐变，靠近圆心亮、靠近圆边透明 -->
          <radialGradient id="gridGrad" gradientUnits="userSpaceOnUse" cx="300" cy="300" r="258">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <!-- 亮线：圆心最亮 → 圆边透明，随扫掠一起旋转 -->
          <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="300" y1="300" x2="558" y2="300">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7fb0f5"/>
            <stop offset="100%" stop-color="#9a8ff0"/>
          </linearGradient>
          <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
          <!-- 光点发光：模糊副本叠两次增强光晕 + 原始清晰核心 -->
          <filter id="blipGlow" x="-300%" y="-300%" width="700%" height="700%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b1"/>
            <feMerge>
              <feMergeNode in="b1"/>
              <feMergeNode in="b1"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- 同心环（外淡内亮，渐变描边） -->
        <g fill="none" stroke="url(#ringGrad)">
          <circle cx="300" cy="300" r="82"  stroke-opacity="0.55" stroke-width="1.5"/>
          <circle cx="300" cy="300" r="142" stroke-opacity="0.40" stroke-width="1.5"/>
          <circle cx="300" cy="300" r="202" stroke-opacity="0.28" stroke-width="1.5"/>
          <circle cx="300" cy="300" r="258" stroke-opacity="0.18" stroke-width="1.5"/>
        </g>

        <!-- 网格线：径向渐变，靠近圆心亮、靠近圆边透明 -->
        <g stroke="url(#gridGrad)" stroke-width="1.5">
          <line x1="42" y1="300" x2="558" y2="300"/>
          <line x1="300" y1="42" x2="300" y2="558"/>
          <line x1="114" y1="114" x2="486" y2="486"/>
          <line x1="486" y1="114" x2="114" y2="486"/>
        </g>

        <!-- 连接轨迹：核心 → 竞品（极淡，仅作结构暗示，节点平时不显示） -->
        <g stroke="#cfe0ff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 6">
          <line x1="300" y1="300" x2="430" y2="225"/>
          <line x1="300" y1="300" x2="338" y2="83"/>
          <line x1="300" y1="300" x2="144" y2="390"/>
          <line x1="300" y1="300" x2="84"  y2="175"/>
          <line x1="300" y1="300" x2="252" y2="168"/>
          <line x1="300" y1="300" x2="405" y2="118"/>
          <line x1="300" y1="300" x2="242" y2="460"/>
        </g>

        <!-- 扫掠光束：由 JS 生成 60 条 1° 细三角，沿角度平滑衰减(前导亮→拖尾透明)，再叠一条前导亮线 -->
        <g id="sweep"></g>

        <!-- 竞品小光点：平时 opacity=0，被光束扫到才亮起、随后拖尾淡出 -->
        <!-- 沿圆周每 22.5° 均匀铺开 16 个，半径交替 165/230，避免扎堆 -->
        <g>
          <g class="blip" data-x="465" data-y="300" data-color="#4d8bff">
            <circle class="ping" cx="465" cy="300" r="7" fill="none" stroke="#4d8bff" stroke-width="2"/>
            <circle class="dot" cx="465" cy="300" r="6.5" fill="#4d8bff" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="513" data-y="212" data-color="#2f88ff">
            <circle class="ping" cx="513" cy="212" r="7" fill="none" stroke="#2f88ff" stroke-width="2"/>
            <circle class="dot" cx="513" cy="212" r="6.5" fill="#2f88ff" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="417" data-y="183" data-color="#2f6bff">
            <circle class="ping" cx="417" cy="183" r="7" fill="none" stroke="#2f6bff" stroke-width="2"/>
            <circle class="dot" cx="417" cy="183" r="6.5" fill="#2f6bff" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="388" data-y="88" data-color="#b27bff">
            <circle class="ping" cx="388" cy="88" r="7" fill="none" stroke="#b27bff" stroke-width="2"/>
            <circle class="dot" cx="388" cy="88" r="6.5" fill="#b27bff" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="300" data-y="135" data-color="#ff7a7a">
            <circle class="ping" cx="300" cy="135" r="7" fill="none" stroke="#ff7a7a" stroke-width="2"/>
            <circle class="dot" cx="300" cy="135" r="6.5" fill="#ff7a7a" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="212" data-y="88" data-color="#cfd3da">
            <circle class="ping" cx="212" cy="88" r="7" fill="none" stroke="#cfd3da" stroke-width="2"/>
            <circle class="dot" cx="212" cy="88" r="6.5" fill="#cfd3da" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="183" data-y="183" data-color="#b3b8c2">
            <circle class="ping" cx="183" cy="183" r="7" fill="none" stroke="#b3b8c2" stroke-width="2"/>
            <circle class="dot" cx="183" cy="183" r="6.5" fill="#b3b8c2" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="88" data-y="212" data-color="#4d8bff">
            <circle class="ping" cx="88" cy="212" r="7" fill="none" stroke="#4d8bff" stroke-width="2"/>
            <circle class="dot" cx="88" cy="212" r="6.5" fill="#4d8bff" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="135" data-y="300" data-color="#2f88ff">
            <circle class="ping" cx="135" cy="300" r="7" fill="none" stroke="#2f88ff" stroke-width="2"/>
            <circle class="dot" cx="135" cy="300" r="6.5" fill="#2f88ff" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="88" data-y="388" data-color="#2f6bff">
            <circle class="ping" cx="88" cy="388" r="7" fill="none" stroke="#2f6bff" stroke-width="2"/>
            <circle class="dot" cx="88" cy="388" r="6.5" fill="#2f6bff" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="183" data-y="417" data-color="#b27bff">
            <circle class="ping" cx="183" cy="417" r="7" fill="none" stroke="#b27bff" stroke-width="2"/>
            <circle class="dot" cx="183" cy="417" r="6.5" fill="#b27bff" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="212" data-y="513" data-color="#ff7a7a">
            <circle class="ping" cx="212" cy="513" r="7" fill="none" stroke="#ff7a7a" stroke-width="2"/>
            <circle class="dot" cx="212" cy="513" r="6.5" fill="#ff7a7a" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="300" data-y="465" data-color="#cfd3da">
            <circle class="ping" cx="300" cy="465" r="7" fill="none" stroke="#cfd3da" stroke-width="2"/>
            <circle class="dot" cx="300" cy="465" r="6.5" fill="#cfd3da" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="388" data-y="513" data-color="#b3b8c2">
            <circle class="ping" cx="388" cy="513" r="7" fill="none" stroke="#b3b8c2" stroke-width="2"/>
            <circle class="dot" cx="388" cy="513" r="6.5" fill="#b3b8c2" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="417" data-y="417" data-color="#4d8bff">
            <circle class="ping" cx="417" cy="417" r="7" fill="none" stroke="#4d8bff" stroke-width="2"/>
            <circle class="dot" cx="417" cy="417" r="6.5" fill="#4d8bff" stroke="#fff" stroke-width="1.5"/>
          </g>
          <g class="blip" data-x="513" data-y="388" data-color="#2f88ff">
            <circle class="ping" cx="513" cy="388" r="7" fill="none" stroke="#2f88ff" stroke-width="2"/>
            <circle class="dot" cx="513" cy="388" r="6.5" fill="#2f88ff" stroke="#fff" stroke-width="1.5"/>
          </g>
        </g>

        <!-- 核心（你的产品）：低亮度空心同心环，无发光、不抢戏 -->
        <circle cx="300" cy="300" r="22" fill="none" stroke="#7d9bd0" stroke-opacity="0.45" stroke-width="1.5"/>
        <circle cx="300" cy="300" r="13" fill="none" stroke="#7d9bd0" stroke-opacity="0.30" stroke-width="1"/>
        <circle cx="300" cy="300" r="5"  fill="#9fb6dd" fill-opacity="0.7"/>
      </svg>

      <!-- 浮动竞品卡片 -->
      <div class="chip tl">
        <div class="dot" style="background:#4d8bff">飞</div>
        <div class="info"><b>飞书</b><span>多维表格接入 AI 助手</span></div>
      </div>
      <div class="chip tr">
        <div class="dot" style="background:#2f88ff">钉</div>
        <div class="info"><b>钉钉</b><span>下调团队人数限制</span></div>
      </div>
      <div class="chip bl">
        <div class="dot" style="background:#2f6bff">会</div>
        <div class="info"><b>腾讯会议</b><span>AI 实时字幕翻译</span></div>
      </div>
      <div class="chip br">
        <div class="dot" style="background:#b27bff">F</div>
        <div class="info"><b>Figma</b><span>发布 AI 设计生成</span></div>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        <b>7×24 监控</b><span>不间断捕捉</span>
      </div>
      <div class="feature">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v10H9l-5 4z"/></svg></div>
        <b>AI 分析</b><span>提炼关键信息</span>
      </div>
      <div class="feature">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg></div>
        <b>趋势洞察</b><span>发现机会</span>
      </div>
      <div class="feature">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h6M9 15h6"/></svg></div>
        <b>智能报告</b><span>自动周报</span>
      </div>
    </div>
  </aside>

  <script>
    (function () {
      var CX = 300, CY = 300, DUR = 6000, FADE = 48; // 一圈 6s；扫过之后拖尾淡出 48°
      var SVGNS = 'http://www.w3.org/2000/svg';
      var sweep = document.getElementById('sweep');

      // 扫掠扇面细分为 72 条三角，沿角度衰减（前导亮 → 拖尾透明）
      // 幂曲线(指数>1)：亮区集中在最前导一小片、向后拉出长尾平滑收到 0，
      // 尾部自然化掉、不出现硬边界线（恢复 v13 状态，扫掠亮度维持原样）。
      var SECTORS = 72, SPAN = 60, R = 258, MAXOP = 0.72, TAIL = 2.6;
      for (var s = 0; s < SECTORS; s++) {
        var t0 = s * SPAN / SECTORS * Math.PI / 180;
        var t1 = (s + 1) * SPAN / SECTORS * Math.PI / 180;
        var x0 = CX + R * Math.cos(t0), y0 = CY - R * Math.sin(t0);
        var x1 = CX + R * Math.cos(t1), y1 = CY - R * Math.sin(t1);
        var seg = document.createElementNS(SVGNS, 'path');
        seg.setAttribute('d', 'M' + CX + ',' + CY + ' L' + x0.toFixed(2) + ',' + y0.toFixed(2) +
          ' L' + x1.toFixed(2) + ',' + y1.toFixed(2) + ' Z');
        seg.setAttribute('fill', '#ffffff');
        // f: 前导片=1，拖尾片→0；pow(f,TAIL) 让亮区收窄、长尾渐隐
        var f = 1 - s / SECTORS;
        seg.setAttribute('fill-opacity', (MAXOP * Math.pow(f, TAIL)).toFixed(4));
        sweep.appendChild(seg);
      }
      // 前导亮线（最前端那条实线）
      var line = document.createElementNS(SVGNS, 'line');
      line.setAttribute('x1', CX); line.setAttribute('y1', CY);
      line.setAttribute('x2', CX + R); line.setAttribute('y2', CY);
      line.setAttribute('stroke', 'url(#lineGrad)');
      line.setAttribute('stroke-width', '2.5');
      line.setAttribute('filter', 'url(#soft)');
      sweep.appendChild(line);

      var blips = [].map.call(document.querySelectorAll('.blip'), function (g) {
        var x = +g.dataset.x, y = +g.dataset.y;
        var phi = Math.atan2(y - CY, x - CX) * 180 / Math.PI;
        if (phi < 0) phi += 360;
        return { dot: g.querySelector('.dot'), ping: g.querySelector('.ping'), phi: phi };
      });
      var start = null;
      function frame(t) {
        if (start === null) start = t;
        var theta = ((t - start) / DUR * 360) % 360;
        sweep.setAttribute('transform', 'rotate(' + theta + ' ' + CX + ' ' + CY + ')');
        for (var i = 0; i < blips.length; i++) {
          var b = blips[i];
          var d = (((theta - b.phi) + 540) % 360) - 180; // 0=光束正扫过；>0=刚扫过；<0=还没到
          var op = d < 0 ? 0 : Math.max(0, 1 - d / FADE);
          b.dot.setAttribute('opacity', op);
          // 扫过瞬间是亮点，随后光环扩散并淡出（雷达 ping）
          b.ping.setAttribute('r', 7 + (1 - op) * 16);
          b.ping.setAttribute('opacity', op * 0.85);
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
