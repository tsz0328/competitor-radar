<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录页左侧插画 · 原版 vs 升级版 对比</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: #1b2330;
    color: #fff;
  }

  .topbar {
    text-align: center;
    padding: 14px 16px 10px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    letter-spacing: .5px;
  }

  .compare {
    display: flex;
    gap: 14px;
    align-items: stretch;
    padding: 0 14px 18px;
    height: calc(100vh - 52px);
  }

  /* 每个面板占一半 */
  .col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px 16px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
  }
  .col .tag {
    position: absolute; top: 14px; right: 14px;
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  /* 左：原版 —— 浅蓝面板（复刻登录页 brand-panel 环境） */
  .col.orig {
    background: linear-gradient(135deg, #cfe2fb 0%, #eaf3ff 55%, #f6faff 100%);
    color: #1f3a6b;
  }
  .col.orig .tag { background: rgba(31,58,107,0.12); color: #1f3a6b; }
  .col.orig .hl {
    background: linear-gradient(90deg, #8b5cf6, #1f3a6b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* 右：升级版 —— 深蓝面板 */
  .col.up {
    background: radial-gradient(120% 90% at 18% 12%, #1f5fb0 0%, #13407f 42%, #0c2a5c 100%);
    color: #fff;
  }
  .col.up .tag { background: rgba(255,255,255,0.15); color: #fff; }
  .col.up .hl {
    background: linear-gradient(90deg, #b9a9f5, #7fb0f5);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .header { line-height: 1.4; z-index: 2; }
  .title { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  .subtitle { margin-top: 6px; font-size: 12px; opacity: .7; }

  .stage {
    position: relative; z-index: 2;
    flex: 1; display: flex; align-items: center; justify-content: center;
    min-height: 220px;
  }

  .col.orig canvas { width: min(100%, 360px); height: auto; display: block; }
  .col.up svg.radar { width: min(100%, 360px); height: auto; display: block; }

  /* 浮动竞品卡片（仅右栏用） */
  .chip {
    position: absolute; display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.22);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    animation: floatY 5s ease-in-out infinite;
  }
  .chip .dot { width: 26px; height: 26px; border-radius: 50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; flex:none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);}
  .chip .info { display:flex; flex-direction:column; min-width:0; }
  .chip .info b { font-size:12px; font-weight:600; color: rgba(255,255,255,0.92); }
  .chip .info span { font-size:11px; color: rgba(255,255,255,0.66); white-space:nowrap; }
  .chip.tl { left:0; top:6%; animation-delay:0s; }
  .chip.tr { right:0; top:22%; animation-delay:1.2s; }
  .chip.bl { left:2%; bottom:12%; animation-delay:2.4s; }
  .chip.br { right:1%; bottom:3%; animation-delay:3.6s; }
  @keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  /* 底部能力标签 */
  .features { display:flex; justify-content:space-between; gap:6px; z-index:2; }
  .feature { display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; flex:1; }
  .feature .ic { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .col.orig .feature .ic { color:#1f3a6b; background: rgba(31,58,107,0.10); }
  .col.up .feature .ic { color:#b9a9f5; background: rgba(255,255,255,0.16); }
  .feature .ic svg { width:17px; height:17px; }
  .feature b { font-size:12px; font-weight:600; }
  .feature span { font-size:10px; opacity:.6; }

  circle.dot { filter: url(#blipGlow); }
</style>
</head>

  <script>
  /* ===== 左：原版 Canvas 2D 雷达（从 RadarCanvas.vue 移植，纯 JS） ===== */
  (function () {
    var canvas = document.getElementById('radarOrig');
    var c = canvas.getContext('2d');
    var W = 360, H = 360;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    var cx = W / 2, cy = H / 2, radius = Math.min(W, H) / 2 - 4;

    var SWEEP_PERIOD = Math.PI * 2, SWEEP_SPEED = Math.PI / 3, TAIL_LENGTH = Math.PI / 2.5, BLIP_FADE = Math.PI * 0.5;
    var COLOR_SWEEP = "160, 120, 250";
    var C = { blue:"99,102,241", orange:"255,170,90", cyan:"56,224,235", pink:"244,114,182", yellow:"250,204,21" };
    function gridColor(intensity, alpha) {
      var t = Math.max(0, Math.min(1, intensity));
      var r = Math.round(160 + (255-160)*(1-t)), g = Math.round(120 + (255-120)*(1-t)), b = Math.round(250 + (255-250)*(1-t));
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }
    var blips = [
      {angle:0.9,radiusRatio:0.92,color:C.blue},{angle:2.2,radiusRatio:0.62,color:C.orange},
      {angle:3.6,radiusRatio:0.78,color:C.cyan},{angle:4.4,radiusRatio:0.45,color:C.pink},
      {angle:5.6,radiusRatio:0.85,color:C.yellow},{angle:1.4,radiusRatio:0.35,color:C.pink},
      {angle:2.9,radiusRatio:0.88,color:C.blue},{angle:4.0,radiusRatio:0.55,color:C.yellow},
      {angle:5.1,radiusRatio:0.68,color:C.cyan},{angle:0.3,radiusRatio:0.5,color:C.orange}
    ];
    var sweepAngle = Math.PI * 0.6, lastFrameTime = 0;

    function drawFrame(ts) {
      var dt = lastFrameTime ? (ts - lastFrameTime)/1000 : 0; lastFrameTime = ts;
      sweepAngle = (sweepAngle + SWEEP_SPEED * dt) % SWEEP_PERIOD;
      c.clearRect(0, 0, W, H);

      var GRID_SLICES = 96, step = (Math.PI * 2) / GRID_SLICES;
      for (var i = 1; i <= 5; i++) {
        var r = (radius * i) / 5, radialFactor = 0.35 + 0.65 * (r/radius), baseAlpha = 1 - 0.75 * (r/radius);
        for (var s = 0; s < GRID_SLICES; s++) {
          var a0 = s * step, a1 = (s + 1) * step;
          var diff0 = (sweepAngle - a0 + Math.PI*2) % (Math.PI*2);
          var diff1 = (sweepAngle - a1 + Math.PI*2) % (Math.PI*2);
          var i0 = diff0 > TAIL_LENGTH ? 0 : (1 - diff0/TAIL_LENGTH) * radialFactor;
          var i1 = diff1 > TAIL_LENGTH ? 0 : (1 - diff1/TAIL_LENGTH) * radialFactor;
          var alpha0 = baseAlpha + (1 - baseAlpha) * i0, alpha1 = baseAlpha + (1 - baseAlpha) * i1;
          var x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0), x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
          if (a0 < sweepAngle && sweepAngle < a1) {
            var xh = cx + r*Math.cos(sweepAngle), yh = cy + r*Math.sin(sweepAngle);
            var gradA = c.createLinearGradient(x0, y0, xh, yh);
            gradA.addColorStop(0, gridColor(i0, alpha0)); gradA.addColorStop(1, gridColor(radialFactor, 1));
            var midA = (i0 + 1) / 2;
            c.beginPath(); c.arc(cx, cy, r, a0, sweepAngle); c.strokeStyle = gradA; c.lineWidth = 1 + 2.5*midA;
            if (midA > 0.7) { c.shadowColor = 'rgba('+COLOR_SWEEP+','+midA+')'; c.shadowBlur = 10*midA; } c.stroke(); c.shadowBlur = 0;
            c.beginPath(); c.arc(cx, cy, r, sweepAngle, a1); c.strokeStyle = gridColor(0, baseAlpha); c.lineWidth = 1; c.stroke();
            continue;
          }
          var grad = c.createLinearGradient(x0, y0, x1, y1);
          grad.addColorStop(0, gridColor(i0, alpha0)); grad.addColorStop(1, gridColor(i1, alpha1));
          var midI = (i0 + i1) / 2;
          c.beginPath(); c.arc(cx, cy, r, a0, a1); c.strokeStyle = grad; c.lineWidth = 1 + 2.5*midI;
          if (midI > 0.7) { c.shadowColor = 'rgba('+COLOR_SWEEP+','+midI+')'; c.shadowBlur = 10*midI; } else { c.shadowBlur = 0; } c.stroke();
        }
      }
      c.shadowBlur = 0;
      function drawRadialSegment(x0, y0, x1, y1, angle) {
        var diff = (sweepAngle - angle + Math.PI*2) % (Math.PI*2);
        var intensity = diff > TAIL_LENGTH ? 0 : 1 - diff/TAIL_LENGTH;
        var grad = c.createLinearGradient(x0, y0, x1, y1);
        grad.addColorStop(0, gridColor(intensity, 1)); grad.addColorStop(1, gridColor(intensity, 0.25 + 0.75*intensity));
        c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.strokeStyle = grad; c.lineWidth = 1 + 2.5*intensity;
        if (intensity > 0.7) { c.shadowColor = 'rgba('+COLOR_SWEEP+','+intensity+')'; c.shadowBlur = 10*intensity; } else { c.shadowBlur = 0; } c.stroke();
      }
      drawRadialSegment(cx, cy, cx+radius, cy, 0);
      drawRadialSegment(cx, cy, cx-radius, cy, Math.PI);
      drawRadialSegment(cx, cy, cx, cy+radius, Math.PI/2);
      drawRadialSegment(cx, cy, cx, cy-radius, Math.PI*1.5);
      c.shadowBlur = 0;

      var SLICES = 48;
      for (var k = 0; k < SLICES; k++) {
        var ratio = 1 - k/SLICES;
        var a1 = sweepAngle - (TAIL_LENGTH*k)/SLICES, a0 = sweepAngle - (TAIL_LENGTH*(k+1))/SLICES;
        c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, radius, a0, a1); c.closePath();
        c.fillStyle = 'rgba('+COLOR_SWEEP+','+(0.28*ratio)+')'; c.fill();
      }
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + radius*Math.cos(sweepAngle), cy + radius*Math.sin(sweepAngle));
      var edgeX = cx + radius*Math.cos(sweepAngle), edgeY = cy + radius*Math.sin(sweepAngle);
      var lineGrad = c.createLinearGradient(cx, cy, edgeX, edgeY);
      lineGrad.addColorStop(0, 'rgba('+COLOR_SWEEP+',0)'); lineGrad.addColorStop(1, 'rgba('+COLOR_SWEEP+',1)');
      c.strokeStyle = lineGrad; c.lineWidth = 2; c.stroke();

      for (var bi = 0; bi < blips.length; bi++) {
        var blip = blips[bi];
        var rel = sweepAngle % (Math.PI*2);
        var diff2 = (rel - blip.angle + Math.PI*2) % (Math.PI*2);
        var boost = Math.max(0, 1 - diff2/BLIP_FADE);
        if (boost <= 0.02) continue;
        var x = cx + radius*blip.radiusRatio*Math.cos(blip.angle), y = cy + radius*blip.radiusRatio*Math.sin(blip.angle);
        var r0 = Math.max(2.5, radius*0.03), glowR = r0 * 2;
        c.globalCompositeOperation = 'lighter';
        var g = c.createRadialGradient(x, y, 0, x, y, glowR);
        g.addColorStop(0, 'rgba('+blip.color+','+boost+')');
        g.addColorStop(0.25, 'rgba('+blip.color+','+boost+')');
        g.addColorStop(1, 'rgba('+blip.color+',0)');
        c.beginPath(); c.arc(x, y, glowR, 0, Math.PI*2); c.fillStyle = g; c.fill();
        c.globalCompositeOperation = 'source-over';
      }
      requestAnimationFrame(drawFrame);
    }
    requestAnimationFrame(drawFrame);
  })();

  /* ===== 右：升级版 SVG 雷达（同预览 v17） ===== */
  (function () {
    var CX = 300, CY = 300, DUR = 6000, FADE = 48;
    var SVGNS = 'http://www.w3.org/2000/svg';
    var sweep = document.getElementById('sweep');
    var SECTORS = 72, SPAN = 60, R = 258, MAXOP = 0.72, TAIL = 2.6;
    for (var s = 0; s < SECTORS; s++) {
      var t0 = s * SPAN / SECTORS * Math.PI / 180, t1 = (s + 1) * SPAN / SECTORS * Math.PI / 180;
      var x0 = CX + R*Math.cos(t0), y0 = CY - R*Math.sin(t0), x1 = CX + R*Math.cos(t1), y1 = CY - R*Math.sin(t1);
      var seg = document.createElementNS(SVGNS, 'path');
      seg.setAttribute('d', 'M'+CX+','+CY+' L'+x0.toFixed(2)+','+y0.toFixed(2)+' L'+x1.toFixed(2)+','+y1.toFixed(2)+' Z');
      seg.setAttribute('fill', '#ffffff');
      var f = 1 - s / SECTORS;
      seg.setAttribute('fill-opacity', (MAXOP * Math.pow(f, TAIL)).toFixed(4));
      sweep.appendChild(seg);
    }
    var line = document.createElementNS(SVGNS, 'line');
    line.setAttribute('x1', CX); line.setAttribute('y1', CY);
    line.setAttribute('x2', CX + R); line.setAttribute('y2', CY);
    line.setAttribute('stroke', 'url(#lineGrad)'); line.setAttribute('stroke-width', '2.5');
    line.setAttribute('filter', 'url(#soft)');
    sweep.appendChild(line);

    var blips = [].map.call(document.querySelectorAll('.blip'), function (g) {
      var x = +g.dataset.x, y = +g.dataset.y;
      var phi = Math.atan2(y - CY, x - CX) * 180 / Math.PI; if (phi < 0) phi += 360;
      return { dot: g.querySelector('.dot'), ping: g.querySelector('.ping'), glow: g.querySelector('.glow'), phi: phi };
    });
    var start = null;
    function frame(t) {
      if (start === null) start = t;
      var theta = ((t - start) / DUR * 360) % 360;
      sweep.setAttribute('transform', 'rotate(' + theta + ' ' + CX + ' ' + CY + ')');
      for (var i = 0; i < blips.length; i++) {
        var b = blips[i];
        var d = (((theta - b.phi) + 540) % 360) - 180;
        var op = d < 0 ? 0 : Math.max(0, 1 - d / FADE);
        b.dot.setAttribute('opacity', op); b.glow.setAttribute('opacity', op);
        b.ping.setAttribute('r', 7 + (1 - op) * 16); b.ping.setAttribute('opacity', op * 0.85);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
