<!-- Vite + Vue 项目的入口 HTML 模板，浏览器第一个加载，挂载 div + 启动脚本 -->

<!-- 文档类型声明，用 HTML5 标准来解析 -->
<!doctype html>
<!-- HTML 根元素，lang 属性用于设置语言 -->
<html lang="zh-CN">
  <!-- 头部元素，用于存放元数据 -->
  <head>
    <!-- 编码声明 -->
    <meta charset="UTF-8" />
    <!-- 视口设置，用于控制页面在不同设备上的缩放和布局 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 页面标题 -->
    <title>竞品雷达</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <!-- 挂载点，通过 id 来获取元素-->
    <div id="app"></div>
    <!-- 加载入口脚本 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
